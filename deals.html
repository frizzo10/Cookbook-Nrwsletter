<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biggest Grocery Deals This Week — The Cultured Table</title>
<meta name="description" content="Fern's weekly roundup of the best real grocery deals, pulled straight from scanned store circulars.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Pro:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a1a; --warm:#fffdf5; --gold:#c8922a; --gold-light:#e8c97e; --parchment:#f5f0e8; --border:#ede8dc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--warm); font-family:'Crimson Pro', Georgia, serif; color:var(--ink); }
  header { background:var(--ink); padding:36px 24px 28px; text-align:center; }
  header .eyebrow { font-family:'Space Mono', monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:0 0 10px; }
  header h1 { font-family:'Playfair Display', serif; font-size:32px; color:var(--warm); margin:0 0 6px; font-weight:700; }
  header p { color:#bbb; font-size:14px; margin:0; }
  nav.nav-strip { display:flex; justify-content:center; gap:0; border-bottom:2px solid var(--gold); background:var(--parchment); flex-wrap:wrap; }
  nav.nav-strip a { font-family:'Space Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); text-decoration:none; padding:14px 22px; border-left:1px solid var(--border); }
  nav.nav-strip a:hover { color:var(--gold); background:rgba(200,146,42,.06); }
  main { max-width:640px; margin:0 auto; padding:40px 24px 80px; }
  .post-meta { font-family:'Space Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin:0 0 8px; }
  .post-title { font-family:'Playfair Display', serif; font-size:30px; margin:0 0 16px; }
  .post-intro { font-size:17px; line-height:1.7; color:#444; margin:0 0 32px; }
  .deal-card { border-left:3px solid var(--gold); padding:14px 20px; margin-bottom:18px; background:var(--parchment); }
  .deal-card .item { font-size:17px; font-weight:600; margin:0 0 4px; }
  .deal-card .store { font-family:'Space Mono', monospace; font-size:11px; color:#999; text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px; }
  .deal-card .note { font-size:15px; color:#555; margin:0; line-height:1.6; }
  .closing { font-size:16px; font-style:italic; color:#555; margin:32px 0 0; padding-top:24px; border-top:1px solid var(--border); }
  .archive { margin-top:56px; padding-top:24px; border-top:2px solid var(--border); }
  .archive h2 { font-family:'Playfair Display', serif; font-size:20px; margin:0 0 14px; }
  .archive a { display:block; font-size:14px; color:var(--ink); text-decoration:none; padding:8px 0; border-bottom:1px solid var(--border); }
  .archive a:hover { color:var(--gold); }
  .empty { text-align:center; padding:60px 20px; color:#999; font-size:16px; }
  footer { text-align:center; padding:28px; color:#aaa; font-size:12px; }
  footer a { color:var(--gold); text-decoration:none; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">🌿 The Cultured Table</p>
  <h1>Biggest Deals This Week</h1>
  <p>Real grocery deals, pulled from Fern's scanned store circulars</p>
</header>

<nav class="nav-strip">
  <a href="/">Newsletter</a>
  <a href="/deals.html">Deals</a>
  <a href="/#subscribe">Subscribe</a>
  <a href="https://app.clickpickandcook.com" target="_blank">Get Fern</a>
</nav>

<main id="main">
  <p class="empty">Loading this week's deals…</p>
</main>

<footer>
  Curated automatically by Fern, from real scanned store circulars.<br>
  <a href="https://app.clickpickandcook.com">Scan your own circular with Fern →</a>
</footer>

<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const week = params.get('week');
  const url = '/.netlify/functions/get-deals-digest' + (week ? '?week=' + encodeURIComponent(week) : '');
  const main = document.getElementById('main');
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.post) {
      main.innerHTML = '<p class="empty">No deals digest published yet — check back soon.</p>';
      return;
    }
    const p = data.post;
    let html = '';
    html += '<p class="post-meta">Week of ' + p.week_of + '</p>';
    html += '<h2 class="post-title">' + esc(p.title || 'This Week\\'s Deals') + '</h2>';
    if (p.intro) html += '<p class="post-intro">' + esc(p.intro) + '</p>';
    (p.deals || []).forEach(d => {
      html += '<div class="deal-card">';
      html += '<p class="item">' + esc(d.item || '') + '</p>';
      if (d.store) html += '<p class="store">' + esc(d.store) + '</p>';
      if (d.note) html += '<p class="note">' + esc(d.note) + '</p>';
      html += '</div>';
    });
    if (p.closing) html += '<p class="closing">' + esc(p.closing) + '</p>';

    if (data.archive && data.archive.length > 1) {
      html += '<div class="archive"><h2>Past Weeks</h2>';
      data.archive.forEach(k => {
        if (k === p.week_of) return;
        html += '<a href="/deals.html?week=' + encodeURIComponent(k) + '">Week of ' + k + '</a>';
      });
      html += '</div>';
    }
    main.innerHTML = html;
  } catch (e) {
    main.innerHTML = '<p class="empty">Couldn\\'t load this week\\'s deals. Try refreshing.</p>';
  }
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
load();
</script>

</body>
</html>

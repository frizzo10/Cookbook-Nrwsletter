[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."generate-newsletter"]
  timeout = 60

[functions."generate-content-queue"]
  timeout = 60

# Monthly cron — 1st of every month at 9am UTC
[[scheduled_functions]]
  name = "generate-newsletter"
  cron = "0 9 1 * *"

# Twice-weekly cron — Monday and Thursday at 10am UTC
[[scheduled_functions]]
  name = "generate-content-queue"
  cron = "0 10 * * 1,4"
